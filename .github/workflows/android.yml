name: Android build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_NDK_HOME: ${{ runner.temp }}/android-sdk/ndk/28.2.13676358
      DSH_BUILD_JOBS: 4
      DSH_CI_CLEAN_OBJECTS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.3
      - run: npm install --global pnpm@11.28.5
      - run: rustup toolchain install 1.85.1 --profile minimal && rustup target add --toolchain 1.85.1 aarch64-linux-android x86_64-linux-android
      - run: sudo apt-get update && sudo apt-get install -y python3 build-essential autoconf automake libtool pkg-config unzip
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools emulator
      - run: sudo chmod 666 /dev/kvm
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: actions/cache@v6
        with:
          path: runtime/downloads
          key: android-sources-${{ hashFiles('sources.lock.json') }}
      - run: npm test
      - run: bash scripts/build-runtime.sh
      - run: chmod +x gradlew && ./gradlew :app:testX64DebugUnitTest :app:lintX64Debug :app:assembleX64Debug :app:assembleArm64Debug :app:assembleX64DebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          script: ./gradlew :app:connectedX64DebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-build-evidence
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/src/main/assets/runtime-manifest.json
          retention-days: 14


